manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: urob
      url-base: https://github.com/urob
    - name: joelspadin
      url-base: https://github.com/joelspadin
    - name: greenring
      url-base: https://github.com/greenring
    - name: caksoylar
      url-base: https://github.com/caksoylar
    - name: englmaxi
      url-base: https://github.com/englmaxi
  projects:
    - name: zmk
      remote: greenring
      revision: main
      import: app/west.yml
    - name: zmk-helpers
      remote: urob
      revision: main
    - name: zmk-rgbled-widget
      remote: caksoylar
      # pinned pre-central-battery; newer main needs zmk/split/central.h which
      # this ZMK revision doesn't have. Keep in sync with the debug branch.
      revision: fdcd7cac82a6c0cb1311bce9bc21ba2be4004019
    - name: zmk-dongle-display
      remote: greenring
      # our fork's v0.3-battery-fix branch: upstream v0.3 (LVGL 8 / Zephyr
      # 3.5, matching this pinned ZMK - 'main' needs Zephyr 4.1 / LVGL 9)
      # plus a fixed battery widget that re-reads each half's level from the
      # central instead of trusting coalesced events, shows disconnected
      # halves as '--', and drops the phantom dongle entry.
      revision: 7af54c6103b050d21ee7a49eed1ebecb6c4ea33c
  self:
    path: config
