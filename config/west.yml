manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: urob
      url-base: https://github.com/urob
    - name: joelspadin
      url-base: https://github.com/joelspadin
    - name: greenring
      url-base: https://github.com/greenring
    - name: caksoylar
      url-base: https://github.com/caksoylar
    - name: englmaxi
      url-base: https://github.com/englmaxi
  projects:
    - name: zmk
      remote: greenring
      revision: main
      import: app/west.yml
    - name: zmk-helpers
      remote: urob
      revision: main
    - name: zmk-rgbled-widget
      remote: caksoylar
      # pinned pre-central-battery; newer main needs zmk/split/central.h which
      # this ZMK revision doesn't have. Keep in sync with the debug branch.
      revision: fdcd7cac82a6c0cb1311bce9bc21ba2be4004019
  # englmaxi/zmk-dongle-display is no longer pulled in as a module: the
  # dongle_display shield is vendored under boards/shields/dongle_display
  # (from its v0.3, the LVGL 8 / Zephyr 3.5 version this ZMK needs) with a
  # fixed battery widget. See that directory's README.
  self:
    path: config
