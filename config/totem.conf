# DIAGNOSTIC BRANCH - DO NOT MERGE, DO NOT LEAVE ON THE KEYBOARD.
#
# USB CDC ACM console, so a half can report what its battery sensor is doing.
# ZMK_LOG_LEVEL already defaults to 4 (debug), so battery.c's LOG_DBG lines are
# compiled in and no extra log config is needed.
CONFIG_ZMK_USB_LOGGING=y

# Sample every 10s instead of 60s so the lines show up promptly. Sampling stops
# when the half goes idle (battery.c stops the timer on ZMK_ACTIVITY_IDLE), so
# raise the idle timeout too - otherwise 30s of not typing silences the log.
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=10
CONFIG_ZMK_IDLE_TIMEOUT=600000
CONFIG_ZMK_POINTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y 
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y