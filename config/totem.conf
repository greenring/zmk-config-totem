CONFIG_ZMK_USB_LOGGING=n
CONFIG_ZMK_POINTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y 
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Chatter workaround: the QWERTY-E / Dvorak-. switch (left top row, 3rd key)
# double-fires. These override the debounce-*-ms devicetree properties for every
# kscan instance (ZMK default is 5/5). Longer release debounce is what suppresses
# chatter; press stays at 5 so typing latency is unchanged.
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=5
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=50