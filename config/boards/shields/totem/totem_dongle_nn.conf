CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

CONFIG_ZMK_SLEEP=n
CONFIG_ZMK_EXT_POWER=y

# words-per-minute meter
CONFIG_ZMK_DONGLE_DISPLAY_WPM=y

# Give the dongle its own battery row. Not because its own level is
# interesting - it is USB powered - but because the widget breaks without it.
#
# zmk-dongle-display sizes and indexes its battery rows by SOURCE_OFFSET, which
# is 1 with this option and 0 without. Peripherals are drawn at row
# `ev->source + SOURCE_OFFSET`, but the dongle's own level is always drawn at
# row 0, hardcoded. With the option off, both land on row 0 and the dongle
# overwrites the first half.
#
# It happens on every boot: ZMK_DISPLAY_WIDGET_LISTENER runs the widget's state
# function once with a NULL event, which takes the central branch - source 0,
# level zmk_battery_state_of_charge() (still 0 that early), usb_present true.
# Since the row is shown whenever usb_present is set, row 0 sits there reading
# "0%" until the first half reports in. If that half is flat or out of range it
# never reports, so the screen shows a phantom 0% for a half it has not heard
# from. A real half at 0% cannot look like this - peripheral rows are hidden at
# level 0 - so any 0% on screen is this bug.
#
# Upstream still hardcodes source 0 on main, so the offset is the only fix
# available from config.
CONFIG_ZMK_DONGLE_DISPLAY_DONGLE_BATTERY=y
