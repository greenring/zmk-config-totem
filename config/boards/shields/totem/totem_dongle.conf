CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# 2 peripheral (left/right) connections + 5 host BLE profiles, so the dongle
# can still pair to a PC over Bluetooth (for battery reporting) even though
# keystrokes are sent over USB. See readme.md for Windows battery monitoring.
CONFIG_BT_MAX_CONN=7
CONFIG_BT_MAX_PAIRED=7

CONFIG_ZMK_SLEEP=n
# CONFIG_PM_DEVICE=n
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000
CONFIG_ZMK_EXT_POWER=y
