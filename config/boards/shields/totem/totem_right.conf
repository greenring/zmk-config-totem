# DIAGNOSTIC BRANCH - DO NOT MERGE, DO NOT LEAVE ON THE KEYBOARD.
#
# Ask the right half why its reported battery level is pinned at 100%.
#
# The USB CDC ACM console itself comes from the zmk-usb-logging snippet wired up
# in build.yaml - it carries the zephyr,cdc-acm-uart node that ZMK_USB_LOGGING's
# selects need. Setting the symbol here as well is belt and braces: this file is
# merged after config/totem.conf, which pins it off for normal builds.
CONFIG_ZMK_USB_LOGGING=y

# Sample every 10s instead of 60s so lines appear promptly, and stretch the idle
# timeout to 10 minutes - battery.c stops its sampling timer on
# ZMK_ACTIVITY_IDLE, so the stock 30s would silence the log between keypresses.
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=10
CONFIG_ZMK_IDLE_TIMEOUT=600000
